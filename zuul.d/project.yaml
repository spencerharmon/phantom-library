---
# Phantom Library — Zuul project-pipeline attachment.
#
# UNTRUSTED project: attach jobs ONLY to pipelines flux's Zuul config-project
# already defines (check / gate). Do NOT declare a `pipeline:` here, and do NOT
# set `name:` — it defaults to this repository, which is what we want.
#
# Cross-repo prerequisite (NOT this repo's change): for these jobs to load and
# run in the deployed tenant, flux must register spencerharmon/phantom-library
# under `untrusted-projects` in infrastructure/zuul/tenant-config.yaml. Tracked
# via the authorized phantom-library<->flux submodule link; see docs/ci-zuul.md.

- project:
    check:
      jobs:
        - phantom-library-nonrig-build-test
    gate:
      jobs:
        - phantom-library-nonrig-build-test
