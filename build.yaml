# JPRM-compatible plugin build manifest. Consumed by
# `jprm plugin build` to produce the release zip + by the
# GitHub Actions workflow to update the repository manifest.
#
# See: https://github.com/oddstr13/jellyfin-plugin-repository-manager
name: "Phantom Library"
guid: "9e7a1f4c-2b5d-4e8f-9a3b-7c1d2e5f6a8b"
version: "0.3.0.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "spencerharmon"
overview: "Makes the entire TMDB catalogue appear inside Jellyfin. Lazy-materialises titles via gostream's FUSE-backed virtual MKVs."
description: |
  Phantom Library surfaces every TMDB title inside Jellyfin's native
  search, suggestions, and "similar to" rows. Pressing favourite or
  play on a Virtual item triggers the plugin to ask gostream to
  register the matching torrent; the resulting FUSE-backed .mkv
  becomes a real, scannable, streamable Jellyfin library item.

  Two layers of lazy loading:
    1. Phantom -> Virtual -> Materialised (this plugin, driven by
       user interactions).
    2. gostream's FUSE pull-bytes-on-demand layer (gostream).

  Mascot: Stygiomedusa gigantea, the giant phantom jelly.
category: "Metadata"
artifacts:
  - "Jellyfin.Plugin.PhantomLibrary.dll"
changelog: |
  v0.1.0 - initial release. Movie + series remote search, virtual item
  creation, materialisation via gostream /api/library/add, fake play
  button + splash, suggestions integration, eviction sweeper, series
  autopilot.
