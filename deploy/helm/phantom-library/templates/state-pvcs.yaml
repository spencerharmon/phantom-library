{{/*
Storage split:
  * Per-INSTANCE gostream STATE PVC (gostream-state[-<suffix>]) — rendered with the workload. Holds
    <root>/STATE/gostream.db (inode map, SACRED) and <root>/config.db (gostorm BoltDB: torrents +
    TorrentsSavePath + settings). Both are SINGLE-WRITER embedded DBs (bbolt exclusive lock; SQLite
    single-writer), so each workload instance owns its own.
  * The SHARED warmup PVC (.Values.shared.warmupPvcName) — rendered with components.shared. The
    infohash-addressed warmup cache at gostorm's TorrentsSavePath (/usr/local/warmup) is
    content-addressed, so both colors converge on identical filenames and share ONE RWO PVC
    (co-resident on the one local-path node).
WARMUP-SIZING INVARIANT: capacity = warmup.quotaGb + warmup.headroomGi, so it can never be smaller
than the quota gostream enforces (quota = quotaGb * 1024^3). Both this size and the ConfigMap's
disk_warmup_quota_gb come from .Values.warmup — the single source Helm gives us.
*/}}
{{- if .Values.components.workload }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gostream-state{{ include "phantom-library.suffix" . }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: state
    {{- with (include "phantom-library.colorLabel" .) }}
    color: {{ . }}
    {{- end }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.state.size }}
{{- end }}
{{- if and .Values.components.workload .Values.components.shared }}
---
{{- end }}
{{- if .Values.components.shared }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.shared.warmupPvcName }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: warmup-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ printf "%dGi" (add (.Values.warmup.quotaGb | int) (.Values.warmup.headroomGi | int)) }}
{{- end }}
