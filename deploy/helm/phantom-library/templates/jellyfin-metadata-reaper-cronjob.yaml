{{- if and .Values.components.jellyfinMetadata .Values.jellyfinMetadataReaper.enabled }}
{{/*
Enforcing LRU reaper for the shared jellyfin-metadata cache (task jellyfin-metadata-quota-reaper).
Owned by the release that enables components.jellyfinMetadata — the SAME release that owns the PVC
(jellyfin-pvcs.yaml), so the CronJob and the volume it reaps are always rendered together.

The reaper script itself ships in THIS ConfigMap rather than a separate image: it runs inside the
jellyfin-phantom image (already mounted here, already has GNU coreutils/findutils), so no extra image
build/pin is needed for what is fundamentally `find` + `du` + `rm`. `jellyfinMetadata.quotaGb` is the
single source of truth shared with the PVC's derived size (see jellyfin-pvcs.yaml) — changing it
alone moves both the enforced quota and the volume capacity.

The script content is `deploy/helm/phantom-library/files/jellyfin-metadata-reaper.sh` — a byte-
identical copy of `scripts/jellyfin-metadata-reaper.sh` (Helm's `.Files.Get` cannot read outside the
chart directory, so the authoritative, directly-tested copy at `scripts/` and the chart-embedded copy
here must be kept in sync by hand on any edit; `scripts/tests/jellyfin-metadata-quota-reaper.test.sh`
asserts the two are identical so a drift fails the check rather than silently diverging).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-metadata-reaper-script
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: jellyfin-metadata-reaper
data:
  jellyfin-metadata-reaper.sh: |
{{ .Files.Get "files/jellyfin-metadata-reaper.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-metadata-reaper
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: jellyfin-metadata-reaper
spec:
  schedule: {{ .Values.jellyfinMetadataReaper.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.jellyfinMetadataReaper.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.jellyfinMetadataReaper.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # A slow/interrupted reap must not pile up runs; Forbid above + a bounded deadline together
      # keep at most one reaper active at a time.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            {{- include "phantom-library.labels" . | nindent 12 }}
            app.kubernetes.io/component: jellyfin-metadata-reaper
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: {{ .Values.imagePullSecret }}
          {{- if .Values.jellyfinMetadataReaper.importance.enabled }}
          # The workload image ships no psql, so the importance query runs HERE, in a
          # postgres-client image, and hands the resulting "<itemid> <tier>" map to the
          # reaper over an emptyDir. Failure is deliberately non-fatal: the init container
          # exits 0 having written whatever it could, and the reaper degrades to atime-only
          # LRU rather than leaving the disk unprotected.
          initContainers:
            - name: importance-query
              image: {{ .Values.jellyfinMetadataReaper.importance.clientImage | quote }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  out=/var/run/jellyfin-metadata-importance/map.txt
                  : > "$out"
                  if ! PGPASSWORD="$(cat /var/run/jellyfin-metadata-reaper-db/password)" \
                       PGCONNECT_TIMEOUT=10 \
                       psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                            -tA -F' ' --no-align -c "$SQL" > "$out" 2>/tmp/err; then
                    echo "importance-query: FAILED, reaper will degrade to atime LRU" >&2
                    sed -e 's/^/importance-query: /' /tmp/err >&2 || true
                    : > "$out"
                  fi
                  echo "importance-query: wrote $(wc -l < "$out") item tiers"
              env:
                - name: DB_HOST
                  value: {{ .Values.jellyfinMetadataReaper.importance.host | quote }}
                - name: DB_PORT
                  value: {{ .Values.jellyfinMetadataReaper.importance.port | quote }}
                - name: DB_NAME
                  value: {{ .Values.jellyfinMetadataReaper.importance.database | quote }}
                - name: DB_USER
                  value: {{ .Values.jellyfinMetadataReaper.importance.user | quote }}
                - name: SQL
                  value: |-
                    select replace(ud."ItemId"::text,'-',''),
                           max(case
                                 when ud."IsFavorite" then 3
                                 when coalesce(ud."PlaybackPositionTicks",0) > 0 then 3
                                 when ud."LastPlayedDate" is not null
                                      and ud."LastPlayedDate" > now() - interval '{{ .Values.jellyfinMetadataReaper.importance.recentDays }} days' then 2
                                 when coalesce(ud."PlayCount",0) > 0 or ud."Played" then 1
                                 else 0
                               end)
                      from "UserData" ud
                     group by 1
              volumeMounts:
                - name: importance-map
                  mountPath: /var/run/jellyfin-metadata-importance
                - name: reaper-db-password
                  mountPath: /var/run/jellyfin-metadata-reaper-db
                  readOnly: true
          {{- end }}
          containers:
            - name: reaper
              image: {{ include "phantom-library.image" (dict "which" "jellyfin" "root" $) }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command:
                - /bin/bash
                - /var/run/jellyfin-metadata-reaper/jellyfin-metadata-reaper.sh
                - --root
                - /var/lib/jellyfin/metadata
                - --quota-gb
                - {{ .Values.jellyfinMetadata.quotaGb | quote }}
                {{- range .Values.jellyfinMetadataReaper.paths }}
                - --path
                - {{ . | quote }}
                {{- end }}
                {{- if .Values.jellyfinMetadataReaper.importance.enabled }}
                - --importance-file
                - /var/run/jellyfin-metadata-importance/map.txt
                - --recent-days
                - {{ .Values.jellyfinMetadataReaper.importance.recentDays | quote }}
                {{- else }}
                - --no-db
                {{- end }}
              resources:
                {{- toYaml .Values.jellyfinMetadataReaper.resources | nindent 16 }}
              volumeMounts:
                - name: jellyfin-metadata
                  mountPath: /var/lib/jellyfin/metadata
                - name: reaper-script
                  mountPath: /var/run/jellyfin-metadata-reaper
                  readOnly: true
                {{- if .Values.jellyfinMetadataReaper.importance.enabled }}
                - name: importance-map
                  mountPath: /var/run/jellyfin-metadata-importance
                  readOnly: true
                {{- end }}
          volumes:
            - name: jellyfin-metadata
              persistentVolumeClaim:
                claimName: {{ .Values.jellyfinMetadata.pvcName }}
            - name: reaper-script
              configMap:
                name: jellyfin-metadata-reaper-script
                defaultMode: 0555
            {{- if .Values.jellyfinMetadataReaper.importance.enabled }}
            # emptyDir carrying the init container's tier map to the reaper. The DB password
            # is mounted ONLY into the init container — the reaper never sees the credential.
            - name: importance-map
              emptyDir: {}
            - name: reaper-db-password
              secret:
                secretName: {{ .Values.jellyfinMetadataReaper.importance.passwordSecretName | quote }}
                defaultMode: 0400
                items:
                  - key: {{ .Values.jellyfinMetadataReaper.importance.passwordSecretKey | quote }}
                    path: password
            {{- end }}
{{- end }}
