name: release

# Tag-driven release. Tag the repo `v0.1.0` (no leading zero pad, but
# the assembly version stays four-part). The workflow builds, packages
# a Jellyfin-plugin-format zip, computes its MD5, appends a new
# `versions[]` entry to `manifest.json` on `main`, and attaches the zip
# to a GitHub release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python (for JPRM)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install JPRM
        run: pip install jprm

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # strip leading v
          V="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # JPRM wants a four-part version
          if [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "asmver=${V}.0" >> "$GITHUB_OUTPUT"
          else
            echo "asmver=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          dotnet restore src/Jellyfin.Plugin.PhantomLibrary/Jellyfin.Plugin.PhantomLibrary.csproj
          dotnet build src/Jellyfin.Plugin.PhantomLibrary/Jellyfin.Plugin.PhantomLibrary.csproj \
            -c Release \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:AssemblyVersion=${{ steps.ver.outputs.asmver }} \
            -p:FileVersion=${{ steps.ver.outputs.asmver }} \
            --no-restore

      - name: Package with JPRM
        id: pkg
        run: |
          mkdir -p artifacts
          # JPRM reads build.yaml; override version into a temp copy.
          sed "s/^version: .*/version: \"${{ steps.ver.outputs.asmver }}\"/" build.yaml > build.yaml.release
          mv build.yaml.release build.yaml
          jprm --verbosity=debug plugin build . \
            --output=artifacts \
            --dotnet-configuration=Release \
            --dotnet-framework=net8.0
          ZIP=$(ls artifacts/*.zip | head -n1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json
        run: |
          python3 - <<'PY'
          import json, os, datetime
          version = os.environ["VERSION"]
          checksum = os.environ["CHECKSUM"]
          filename = os.environ["FILENAME"]
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          download_url = f"https://github.com/{repo}/releases/download/{tag}/{filename}"
          with open("manifest.json") as f:
              data = json.load(f)
          entry = {
              "version": version,
              "changelog": f"See https://github.com/{repo}/releases/tag/{tag}",
              "targetAbi": "10.10.0.0",
              "sourceUrl": download_url,
              "checksum": checksum,
              "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          # newest first, dedupe
          data[0]["versions"] = [entry] + [v for v in data[0]["versions"] if v.get("version") != version]
          with open("manifest.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
        env:
          VERSION: ${{ steps.ver.outputs.asmver }}
          CHECKSUM: ${{ steps.pkg.outputs.checksum }}
          FILENAME: ${{ steps.pkg.outputs.filename }}
          TAG: ${{ steps.ver.outputs.tag }}

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git commit -m "manifest: ${{ steps.ver.outputs.tag }}"
            git push origin main
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true
