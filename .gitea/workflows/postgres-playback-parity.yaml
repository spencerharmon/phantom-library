name: postgres-playback-parity
on:
  push:
    branches: [main, bee-p0-postgres-playback-parity-rig]
  pull_request:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (an owned disposable runner may isolate a manual CI check)'
        required: false
        default: k8s
        type: string

jobs:
  playback:
    # This exact manual override is scoped to this job in gitea_runner_policy.py.
    # Push/PR or an empty dispatch input retain the supported shared k8s runner.
    runs-on: ["${{ inputs.runner_label || 'k8s' }}"]
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/dotnet/sdk:9.0.305-noble
    # The self-hosted runner uses host networking: Actions service aliases do
    # not resolve there. Let the rig own a uniquely named PostgreSQL container
    # and an ephemeral loopback port via the runner's mounted Docker socket.
    # Never use a host-global postgres:5432 or stop another job's service.
    env:
      PHANTOM_PARITY_CONTAINER_RUNTIME: docker
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Install test/build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git python3 curl patch docker.io ca-certificates xz-utils
      - uses: actions/checkout@v4
      - name: PostgreSQL movie AND episode native-open playback (mandatory)
        run: ./scripts/tests/postgres-playback-parity.test.sh
      - name: Retain exact artifacts, DSN identity without password, and all scenario evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: postgres-playback-parity
          path: |
            artifacts/playback-parity-*/build-identity.json
            artifacts/playback-parity-*/*-build.log
            artifacts/playback-parity-*/build.log
            artifacts/playback-parity-*/ffmpeg-identity.json
            artifacts/playback-parity-*/results.json
            artifacts/playback-parity-*/movie/*.json
            artifacts/playback-parity-*/movie/*.txt
            artifacts/playback-parity-*/movie/*.log
            artifacts/playback-parity-*/movie/logs/**
            artifacts/playback-parity-*/movie/responses/**
            artifacts/playback-parity-*/episode/*.json
            artifacts/playback-parity-*/episode/*.txt
            artifacts/playback-parity-*/episode/*.log
            artifacts/playback-parity-*/episode/logs/**
            artifacts/playback-parity-*/episode/responses/**
          if-no-files-found: error
