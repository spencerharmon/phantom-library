{{/*
Per-color Deployment: co-located gostream (FUSE producer, privileged, Bidirectional) + patched
Jellyfin (FUSE consumer, unprivileged, HostToContainer RO) in ONE Pod. Rendered once per color.
Strategy Recreate: a color must not double-bind its FUSE hostPath or the shared RWO state PVC with
itself mid-redeploy (cross-color overlap is fine — different hostPaths/selectors).
*/}}
{{- range $color := .Values.colorList }}
{{- $c := index $.Values.colors $color }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phantom-library-{{ $color }}
  labels:
    {{- include "phantom-library.labels" $ | nindent 4 }}
    color: {{ $color }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phantom-library
      color: {{ $color }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phantom-library
        app.kubernetes.io/part-of: phantom-library
        color: {{ $color }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: {{ $.Values.podSecurityContext.fsGroup }}
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecret }}
      containers:
        # ----- gostream: FUSE producer, privileged, Bidirectional -----------------------
        - name: gostream
          image: {{ include "phantom-library.image" (dict "which" "gostream" "color" $color "root" $) }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          securityContext:
            privileged: true # REQUIRED for Bidirectional mountPropagation + /dev/fuse + CAP_SYS_ADMIN
          env:
            {{- range $k, $v := $.Values.gostream.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - { name: proxy, containerPort: {{ $.Values.gostream.ports.proxy }} }
            - { name: metrics, containerPort: {{ $.Values.gostream.ports.metrics }} }
            - { name: gostorm, containerPort: {{ $.Values.gostream.ports.gostorm }} }
          livenessProbe:
            httpGet: { path: /healthz, port: {{ $.Values.gostream.ports.metrics }} }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /readyz, port: {{ $.Values.gostream.ports.metrics }} }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.gostream.resources | nindent 12 }}
          volumeMounts:
            - name: virtual-mkv
              mountPath: /mnt/gostream-mkv-virtual
              mountPropagation: Bidirectional
            - name: real-mkv
              mountPath: /mnt/gostream-mkv-real
            - name: state
              mountPath: /usr/local/state
            - name: warmup
              # Warmup PVC at gostorm's TorrentsSavePath (/usr/local/warmup), where gostorm actually
              # writes the cache — NOT /usr/local/state/warmup.
              mountPath: /usr/local/warmup
            - name: config-merged
              mountPath: /etc/gostream
            - name: config-tuning
              mountPath: /config-src/tuning
              readOnly: true
            - name: config-secret
              mountPath: /config-src/secret
              readOnly: true
        # ----- jellyfin: FUSE consumer, unprivileged, HostToContainer RO ------------------
        - name: jellyfin
          image: {{ include "phantom-library.image" (dict "which" "jellyfin" "color" $color "root" $) }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          ports:
            - { name: http, containerPort: {{ $.Values.jellyfin.httpPort }} }
          readinessProbe:
            httpGet: { path: /health, port: {{ $.Values.jellyfin.httpPort }} }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $.Values.jellyfin.resources | nindent 12 }}
          volumeMounts:
            - name: virtual-mkv
              mountPath: /media/gostream
              mountPropagation: HostToContainer
              readOnly: true
            - name: jellyfin-var-lib
              mountPath: /var/lib/jellyfin
            - name: jellyfin-etc
              mountPath: /etc/jellyfin
            # Plugin preload staging (empty until phantom-library's plugin build/publish pipeline
            # stages a DLL here — Jellyfin runs fine with zero preload plugins).
            - name: plugin-preload
              mountPath: /opt/jellyfin/plugins-preload
      volumes:
        - name: virtual-mkv
          hostPath:
            path: {{ $c.virtualMkvHostPath }}
            type: DirectoryOrCreate
        - name: real-mkv
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: gostream-state
        - name: warmup
          persistentVolumeClaim:
            claimName: gostream-warmup
        - name: config-merged
          emptyDir: {}
        - name: config-tuning
          configMap:
            name: gostream-config
        - name: config-secret
          secret:
            secretName: {{ $.Values.configSecretName }}
        - name: jellyfin-var-lib
          persistentVolumeClaim:
            claimName: jellyfin-var-lib-{{ $color }}
        - name: jellyfin-etc
          persistentVolumeClaim:
            claimName: jellyfin-etc-{{ $color }}
        - name: plugin-preload
          emptyDir: {}
{{- if ne $color (last $.Values.colorList) }}
---
{{- end }}
{{- end }}
