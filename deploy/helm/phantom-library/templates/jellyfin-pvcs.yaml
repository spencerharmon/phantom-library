{{- if .Values.components.jellyfinStorage }}
{{/*
Per-instance Jellyfin persistence (var-lib = library DB/metadata/plugins; etc = network.xml +
encoding config). Each workload instance owns its own so a bad rollout on one instance can never
touch the DB/config of another instance serving traffic.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-var-lib{{ include "phantom-library.suffix" . }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: jellyfin-var-lib
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.jellyfinVarLib.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-etc{{ include "phantom-library.suffix" . }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: jellyfin-etc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.jellyfinEtc.size }}
{{- end }}
{{- if .Values.components.jellyfinMetadata }}
---
{{/*
SHARED, color-independent Jellyfin metadata (artwork) cache. Split out of jellyfin-var-lib so a
blue/green flip never has to copy it (it is derived + identical across colors) and the idle color
does not duplicate ~78G. Shared singleton like warmup/real-mkv: one RWO PVC (fixed name) both colors
mount at /var/lib/jellyfin/metadata via extraVolumes/extraVolumeMounts. Owned by whichever release
enables components.jellyfinMetadata (the `shared` release in the blue/green topology).

SIZING INVARIANT (mirrors warmup in state-pvcs.yaml): capacity = jellyfinMetadata.quotaGb +
jellyfinMetadata.headroomGi, so it can never be smaller than the quota the reaper CronJob
(jellyfin-metadata-reaper-cronjob.yaml) enforces. `persistence.jellyfinMetadata.size` is intentionally
NOT read here — quotaGb+headroomGi is the single source of truth.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.jellyfinMetadata.pvcName }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: jellyfin-metadata
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ printf "%dGi" (add (.Values.jellyfinMetadata.quotaGb | int) (.Values.jellyfinMetadata.headroomGi | int)) }}
{{- end }}
