{{- if .Values.components.workload }}
{{/*
Single-environment workload: gostream (virtual-MKV FUSE producer) + patched Jellyfin (FUSE
consumer) run in ONE CONTAINER, replicating the host's original single-mount-namespace layout.
Kubernetes cannot share a mount namespace between two containers, so a FUSE mounted by a separate
gostream container is invisible (content-wise) to Jellyfin — which is what broke materialise ("FUSE
path did not appear"). The combined image (jellyfin-phantom, which bakes in the gostream binary +
fuse3) runs a supervisor entrypoint: gostream mounts the FUSE at /var/gostream/gostream-mkv-virtual
(the plugin's own GostreamMoviesRoot/ShowsRoot), then Jellyfin reads it in the same namespace. Each
replica keeps its OWN co-located FUSE — never the abandoned gostream-split.

P4 Stage B multi-replica topology: this is a StatefulSet, NOT a Deployment, so ≥2 concurrent
Jellyfin+gostream replicas can run on a color. The per-instance single-writer RWO state
(jellyfin-var-lib, jellyfin-etc, gostream-state) is bound PER REPLICA:
  * replicas == 1 (default, the blue/green single-instance-per-color case): the pod binds the
    pre-existing STATIC per-instance PVCs by fixed claim name (jellyfin-var-lib[-<suffix>] etc.,
    rendered by jellyfin-pvcs.yaml / state-pvcs.yaml). Behaviour and on-disk claims are UNCHANGED
    from the previous Deployment — no PVC is renamed or orphaned.
  * replicas > 1: the per-instance RWO volumes come from volumeClaimTemplates, so replica-N gets its
    OWN <template>-<statefulset>-<N> claim and two replicas can never double-bind one RWO claim
    (Multi-Attach / corrupted single-writer gostream state). The static per-instance PVC objects are
    then suppressed (jellyfin-pvcs.yaml / state-pvcs.yaml) so no unused duplicate is created.
The genuinely SHARED sources (real-mkv, warmup) stay ReadWriteOnce singletons mounted by fixed name
by every replica — they are content-addressed (infohash-named), so replicas co-scheduled on a node
converge on byte-identical files and can share one claim. Shared authoritative library/user data is
in PostgreSQL (Stage A), not shared sqlite. P3 blue/green atomic cutover is unchanged (nameSuffix
still discriminates colors; the Service still selects this color's Pods).

OrderedReady/Recreate semantics: an instance must not double-bind its RWO state PVC with itself
mid-redeploy. podManagementPolicy is OrderedReady (StatefulSet default): a replica's old Pod is
fully terminated (releasing its RWO claim) before its replacement starts, exactly as the old
Deployment's strategy Recreate guaranteed.
*/}}
{{- $multi := gt (int .Values.jellyfin.replicas) 1 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "phantom-library.fullname" . }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: jellyfin
spec:
  replicas: {{ .Values.jellyfin.replicas }}
  # Headless Service governing the StatefulSet's stable per-Pod network identities.
  serviceName: {{ include "phantom-library.fullname" . }}-headless
  # OrderedReady: a replica's old Pod is torn down (RWO claim released) before its replacement
  # starts — the single-writer guarantee the old Deployment got from strategy Recreate.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "phantom-library.workloadSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "phantom-library.workloadSelector" . | nindent 8 }}
        app.kubernetes.io/part-of: phantom-library
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        {{- with .Values.podSecurityContext.fsGroupChangePolicy }}
        # OnRootMismatch: kubelet only recursively chowns the volume when its ROOT dir
        # ownership/perms don't already match fsGroup. Once the tree is owned by fsGroup, every
        # later (re)start skips the walk — avoids the multi-minute chown on the large-file-count
        # metadata PVC that otherwise stalls every pod start. Empty value omits the field.
        fsGroupChangePolicy: {{ . }}
        {{- end }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- if .Values.prowlarrConfig.apiKeySecretName }}
      initContainers:
        # Project prowlarrConfig.baseUrl/the Secret-sourced API key into the plugin's persisted
        # Jellyfin.Plugin.PhantomLibrary.xml (jellyfin-var-lib PVC) BEFORE the workload container
        # starts, so MagnetSelector/ProwlarrClient see Prowlarr as configured/enabled from boot.
        # Idempotent + safe on every restart: enforces these two fields to the chart's values every
        # start (same pattern as PHANTOM_POSTGRES_* env overrides above — the chart is the source of
        # truth for THESE two fields only; every other plugin setting is left untouched). No-ops
        # quietly if the config file does not exist yet (a brand-new PVC before Jellyfin's first
        # boot has written its defaults) — the NEXT restart after that first boot picks it up.
        - name: wire-prowlarr-config
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cfg=/var/lib/jellyfin/plugins/configurations/Jellyfin.Plugin.PhantomLibrary.xml
              if [ ! -f "$cfg" ]; then
                echo "wire-prowlarr-config: $cfg not present yet (first boot) — skipping, will apply on next restart"
                exit 0
              fi
              base_url="{{ .Values.prowlarrConfig.baseUrl }}"
              api_key="$(cat /prowlarr-secret/{{ .Values.prowlarrConfig.apiKeySecretKey }})"
              if grep -q '<ProwlarrBaseUrl>' "$cfg"; then
                sed -i "s#<ProwlarrBaseUrl>.*</ProwlarrBaseUrl>#<ProwlarrBaseUrl>${base_url}</ProwlarrBaseUrl>#" "$cfg"
              else
                sed -i "s#</PluginConfiguration>#  <ProwlarrBaseUrl>${base_url}</ProwlarrBaseUrl>\n</PluginConfiguration>#" "$cfg"
              fi
              if grep -q '<ProwlarrApiKey>' "$cfg"; then
                sed -i "s#<ProwlarrApiKey>.*</ProwlarrApiKey>#<ProwlarrApiKey>${api_key}</ProwlarrApiKey>#" "$cfg"
              else
                sed -i "s#</PluginConfiguration>#  <ProwlarrApiKey>${api_key}</ProwlarrApiKey>\n</PluginConfiguration>#" "$cfg"
              fi
              echo "wire-prowlarr-config: ProwlarrBaseUrl/ProwlarrApiKey set in $cfg"
          volumeMounts:
            - name: jellyfin-var-lib
              mountPath: /var/lib/jellyfin
            - name: prowlarr-secret
              mountPath: /prowlarr-secret
              readOnly: true
      {{- end }}
      containers:
        # ----- combined gostream + Jellyfin (one mount namespace; FUSE producer + consumer) -----
        - name: jellyfin
          image: {{ include "phantom-library.image" (dict "which" "jellyfin" "root" $) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # gostream's settings store resolves config.db / settings.json RELATIVE TO CWD (the settings
          # package's Path var is never set from --path), so it must run with CWD = the gostream root
          # (GOSTREAM_ROOT_PATH). The reference podman unit did this with `--workdir /usr/local/state`;
          # without it the gostorm BoltDB lands in an ephemeral /config.db and every /control settings
          # change is lost on restart. Jellyfin uses absolute paths, so a shared CWD here is harmless.
          workingDir: {{ .Values.gostream.env.GOSTREAM_ROOT_PATH | default "/usr/local/state" }}
          securityContext:
            # REQUIRED: gostream mounts a FUSE inside this container (/dev/fuse + CAP_SYS_ADMIN).
            # This matches the host, which ran gostream as root with --device /dev/fuse --cap-add SYS_ADMIN.
            privileged: true
          env:
            {{- range $k, $v := .Values.gostream.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # ----- jellyfin-metadata generation caps (cut cache growth at the source) -----
            # Read by the patched jellyfin-phantom entrypoint at startup to bound trickplay/
            # person-image/artwork generation — see values.yaml `jellyfin.metadataGeneration` (the
            # single source of truth) and jellyfin-metadata-quota-reaper.md for the incident this
            # addresses. Chart-valued, never a baked config file.
            - name: PHANTOM_JELLYFIN_TRICKPLAY_ENABLED
              value: {{ .Values.jellyfin.metadataGeneration.trickplayEnabled | quote }}
            - name: PHANTOM_JELLYFIN_TRICKPLAY_INTERVAL_SECONDS
              value: {{ .Values.jellyfin.metadataGeneration.trickplayIntervalSeconds | quote }}
            - name: PHANTOM_JELLYFIN_TRICKPLAY_QUALITY_PERCENT
              value: {{ .Values.jellyfin.metadataGeneration.trickplayQualityPercent | quote }}
            - name: PHANTOM_JELLYFIN_PERSON_IMAGE_MAX_DOWNLOADS_PER_REFRESH
              value: {{ .Values.jellyfin.metadataGeneration.personImageMaxDownloadsPerRefresh | quote }}
            - name: PHANTOM_JELLYFIN_ARTWORK_MAX_RESOLUTION_PX
              value: {{ .Values.jellyfin.metadataGeneration.artworkMaxResolutionPx | quote }}
            {{- if .Values.postgres.enabled }}
            # ----- Jellyfin.Pgsql provider (Jellyfin's own jellyfin.db -> shared PostgreSQL) -----
            # Env-var contract owned by the Jellyfin.Pgsql (JPVenson) image/provider itself, not
            # invented here. See values.yaml `postgres` block for the source-of-truth wiring.
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.jellyfin.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.jellyfin.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.jellyfin.db | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.jellyfin.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.jellyfin.passwordSecretName | quote }}
                  key: {{ .Values.postgres.jellyfin.passwordSecretKey | quote }}
            {{- if .Values.postgres.jellyfin.sslMode }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.postgres.jellyfin.sslMode | quote }}
            {{- end }}
            {{- if .Values.postgres.jellyfin.trustServerCertificate }}
            - name: POSTGRES_TRUSTSERVERCERTIFICATE
              value: "true"
            {{- end }}
            - name: POSTGRES_COMMAND_TIMEOUT
              value: {{ .Values.postgres.jellyfin.commandTimeoutSeconds | quote }}
            # ----- plugin's own phantom.db logical DB -> shared PostgreSQL -----
            # Forward-declared for `p4-phantomdb-postgres-backend`: the plugin does not read these
            # yet, but the wiring lands once, generically, per the Stage A step 1/2 task split.
            - name: PHANTOM_POSTGRES_HOST
              value: {{ .Values.postgres.phantom.host | quote }}
            - name: PHANTOM_POSTGRES_PORT
              value: {{ .Values.postgres.phantom.port | quote }}
            - name: PHANTOM_POSTGRES_DB
              value: {{ .Values.postgres.phantom.db | quote }}
            - name: PHANTOM_POSTGRES_USER
              value: {{ .Values.postgres.phantom.user | quote }}
            - name: PHANTOM_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.phantom.passwordSecretName | quote }}
                  key: {{ .Values.postgres.phantom.passwordSecretKey | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: {{ .Values.jellyfin.httpPort }} }
            - { name: proxy, containerPort: {{ .Values.gostream.ports.proxy }} }
            - { name: metrics, containerPort: {{ .Values.gostream.ports.metrics }} }
            - { name: gostorm, containerPort: {{ .Values.gostream.ports.gostorm }} }
          # Readiness gates the Service to Jellyfin being up; liveness restarts a hung Jellyfin.
          # gostream death is caught by the supervisor entrypoint (it exits, restarting the pod).
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.jellyfin.httpPort }} }
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.jellyfin.httpPort }} }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.jellyfin.resources | nindent 12 }}
          volumeMounts:
            # gostream side
            - name: gostream-virtual
              mountPath: /var/gostream
            - name: real-mkv
              mountPath: /mnt/gostream-mkv-real
            - name: state
              mountPath: /usr/local/state
            - name: warmup
              # Warmup PVC at gostorm's TorrentsSavePath (/usr/local/warmup), where gostorm actually
              # writes the cache — NOT /usr/local/state/warmup.
              mountPath: /usr/local/warmup
            - name: config-merged
              mountPath: /etc/gostream
            - name: config-tuning
              mountPath: /config-src/tuning
              readOnly: true
            - name: config-secret
              mountPath: /config-src/secret
              readOnly: true
            # jellyfin side
            - name: jellyfin-var-lib
              mountPath: /var/lib/jellyfin
            - name: jellyfin-etc
              mountPath: /etc/jellyfin
            # Plugin preload staging (empty until phantom-library's plugin build/publish pipeline
            # stages a DLL here — Jellyfin runs fine with zero preload plugins).
            - name: plugin-preload
              mountPath: /opt/jellyfin/plugins-preload
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # FUSE mount point. Ephemeral (the virtual-MKV files are streamed on demand); the container
        # has its own mount namespace, so no per-instance hostPath is needed.
        - name: gostream-virtual
          emptyDir: {}
        - name: real-mkv
          persistentVolumeClaim:
            # SHARED PHYSICAL gostream source (/mnt/gostream-mkv-real): the tiny JSON stub
            # descriptors (magnet/infohash/size/stream-url) gostream scans at startup to build the
            # virtual-MKV FS. Content-addressed (infohash-named) so every replica/color converges on
            # byte-identical files and can share ONE RWO claim by fixed name. Rendered by
            # components.gostreamRealMkv.
            claimName: {{ .Values.realMkv.pvcName }}
        - name: warmup
          persistentVolumeClaim:
            # SHARED gostream warmup cache (content-addressed) — rendered by components.warmupCache.
            claimName: {{ .Values.warmup.pvcName }}
        - name: config-merged
          emptyDir: {}
        - name: config-tuning
          configMap:
            # gostream tuning ConfigMap — rendered by components.gostreamConfig.
            name: {{ .Values.gostreamConfig.configMapName }}
        - name: config-secret
          secret:
            secretName: {{ .Values.configSecretName }}
        - name: plugin-preload
          emptyDir: {}
        {{- if .Values.prowlarrConfig.apiKeySecretName }}
        - name: prowlarr-secret
          secret:
            secretName: {{ .Values.prowlarrConfig.apiKeySecretName }}
        {{- end }}
        {{- if not $multi }}
        # replicas == 1: bind the pre-existing STATIC per-instance RWO PVCs by fixed claim name
        # (rendered by state-pvcs.yaml / jellyfin-pvcs.yaml). Identical to the previous Deployment —
        # no PVC is renamed or orphaned on upgrade.
        - name: state
          persistentVolumeClaim:
            # Per-instance single-writer gostream STATE (STATE/gostream.db inode map + config.db BoltDB).
            claimName: gostream-state{{ include "phantom-library.suffix" . }}
        - name: jellyfin-var-lib
          persistentVolumeClaim:
            claimName: jellyfin-var-lib{{ include "phantom-library.suffix" . }}
        - name: jellyfin-etc
          persistentVolumeClaim:
            claimName: jellyfin-etc{{ include "phantom-library.suffix" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if $multi }}
  # replicas > 1: each replica gets its OWN per-instance single-writer RWO state via
  # volumeClaimTemplates (claim <template>-<statefulset>-<ordinal>), so two replicas can never
  # double-bind one RWO claim (Multi-Attach / corrupted single-writer gostream/jellyfin state).
  # The static per-instance PVC objects are suppressed in this mode (state-pvcs.yaml /
  # jellyfin-pvcs.yaml), so no unused duplicate is created.
  volumeClaimTemplates:
    - metadata:
        name: state
        labels:
          {{- include "phantom-library.labels" . | nindent 10 }}
          app.kubernetes.io/component: state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.state.size }}
    - metadata:
        name: jellyfin-var-lib
        labels:
          {{- include "phantom-library.labels" . | nindent 10 }}
          app.kubernetes.io/component: jellyfin-var-lib
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.jellyfinVarLib.size }}
    - metadata:
        name: jellyfin-etc
        labels:
          {{- include "phantom-library.labels" . | nindent 10 }}
          app.kubernetes.io/component: jellyfin-etc
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.jellyfinEtc.size }}
  {{- end }}
{{- end }}
