name: phantom-library in-cluster acceptance rig
# .gitea/workflows/in-cluster-acceptance-rig.yaml
#
# P3 Stage 5 — the ultimate ROI acceptance bar. Unlike live-rig.yaml (which
# proves the plugin against its OWN throwaway Jellyfin), this job proves the
# ACTUAL deployed phantom-library-bluegreen-deploy stack: the real dev/idle
# color Pod, its co-located gostream FUSE mount, and its shared-Postgres
# plugin state. See tools/ci/in-cluster-acceptance-run.sh for the full
# assertion list and docs/tasks/in-cluster-acceptance-rig.md for the design.
#
# Runs on the self-hosted Gitea Actions runner (already flux-deployed; no
# Zuul/Nodepool nodeset — that provider never existed for this tenant).
# Everything substantive is delegated to
# tools/ci/in-cluster-acceptance-run.sh so this file stays a thin trigger +
# toolchain declaration, mirroring live-rig.yaml / nonrig-gate.yaml.
#
# Never touches production: the script refuses outright if
# PHANTOM_INCLUSTER_DEV_HOST resolves to the color carrying the apex/prod
# host (see GATES.md THE AUTHORITY + the script's own guard).
#
# Regression harness: scripts/tests/in-cluster-acceptance-rig.test.sh proves
# this file parses, runs on the self-hosted runner, declares a pinned
# toolchain, invokes the shared script (never a hand-rolled copy), and that a
# toolchain-agnostic dry run (PHANTOM_CI_DRYRUN=1) exits 0 with no cluster
# access.

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  in-cluster-acceptance:
    name: in-cluster acceptance (deployed dev color, live)
    runs-on: [self-hosted, gitea-actions-runner]
    container:
      image: mcr.microsoft.com/dotnet/sdk:9.0.305-noble
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install kubectl + curl + openssl + jq + python3 (needed by the rig)
        run: |
          set -euo pipefail
          apt-get update -y
          apt-get install -y --no-install-recommends \
            curl ca-certificates openssl jq python3 python3-pip
          curl -fsSL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/$(curl -fsSL -L https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          rm -rf /var/lib/apt/lists/*

      - name: mark repo safe for git (container UID != checkout owner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: write scoped kubeconfig from the provisioned secret
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "$PHANTOM_INCLUSTER_KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          PHANTOM_INCLUSTER_KUBECONFIG_B64: ${{ secrets.PHANTOM_INCLUSTER_KUBECONFIG_B64 }}

      - name: in-cluster acceptance rig (shared script; drives the DEPLOYED dev color live)
        run: ./tools/ci/in-cluster-acceptance-run.sh
        env:
          PHANTOM_INCLUSTER_DEV_HOST: ${{ vars.PHANTOM_INCLUSTER_DEV_HOST }}
          PHANTOM_INCLUSTER_PROD_HOST: ${{ vars.PHANTOM_INCLUSTER_PROD_HOST }}
          PHANTOM_INCLUSTER_NAMESPACE: ${{ vars.PHANTOM_INCLUSTER_NAMESPACE }}
          PHANTOM_INCLUSTER_ADMIN_TOKEN: ${{ secrets.PHANTOM_INCLUSTER_ADMIN_TOKEN }}
