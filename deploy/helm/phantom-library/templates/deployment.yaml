{{/*
Per-color Deployment: gostream (virtual-MKV FUSE producer) + patched Jellyfin (FUSE consumer) run
in ONE CONTAINER, replicating the host's original single-mount-namespace layout. Kubernetes cannot
share a mount namespace between two containers, so a FUSE mounted by a separate gostream container
is invisible (content-wise) to Jellyfin — which is what broke materialise ("FUSE path did not
appear"). The combined image (jellyfin-phantom, which bakes in the gostream binary + fuse3) runs a
supervisor entrypoint: gostream mounts the FUSE at /var/gostream/gostream-mkv-virtual (the plugin's
own GostreamMoviesRoot/ShowsRoot), then Jellyfin reads it in the same namespace. Rendered once per
color. Strategy Recreate: a color must not double-bind its RWO state PVC with itself mid-redeploy.
*/}}
{{- range $color := .Values.colorList }}
{{- $c := index $.Values.colors $color }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phantom-library-{{ $color }}
  labels:
    {{- include "phantom-library.labels" $ | nindent 4 }}
    color: {{ $color }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phantom-library
      color: {{ $color }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phantom-library
        app.kubernetes.io/part-of: phantom-library
        color: {{ $color }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: {{ $.Values.podSecurityContext.fsGroup }}
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecret }}
      containers:
        # ----- combined gostream + Jellyfin (one mount namespace; FUSE producer + consumer) -----
        - name: jellyfin
          image: {{ include "phantom-library.image" (dict "which" "jellyfin" "color" $color "root" $) }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          securityContext:
            # REQUIRED: gostream mounts a FUSE inside this container (/dev/fuse + CAP_SYS_ADMIN).
            # This matches the host, which ran gostream as root with --device /dev/fuse --cap-add SYS_ADMIN.
            privileged: true
          env:
            {{- range $k, $v := $.Values.gostream.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: {{ $.Values.jellyfin.httpPort }} }
            - { name: proxy, containerPort: {{ $.Values.gostream.ports.proxy }} }
            - { name: metrics, containerPort: {{ $.Values.gostream.ports.metrics }} }
            - { name: gostorm, containerPort: {{ $.Values.gostream.ports.gostorm }} }
          # Readiness gates the Service to Jellyfin being up; liveness restarts a hung Jellyfin.
          # gostream death is caught by the supervisor entrypoint (it exits, restarting the pod).
          readinessProbe:
            httpGet: { path: /health, port: {{ $.Values.jellyfin.httpPort }} }
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: {{ $.Values.jellyfin.httpPort }} }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $.Values.jellyfin.resources | nindent 12 }}
          volumeMounts:
            # gostream side
            - name: gostream-virtual
              mountPath: /var/gostream
            - name: real-mkv
              mountPath: /mnt/gostream-mkv-real
            - name: state
              mountPath: /usr/local/state
            - name: warmup
              # Warmup PVC at gostorm's TorrentsSavePath (/usr/local/warmup), where gostorm actually
              # writes the cache — NOT /usr/local/state/warmup.
              mountPath: /usr/local/warmup
            - name: config-merged
              mountPath: /etc/gostream
            - name: config-tuning
              mountPath: /config-src/tuning
              readOnly: true
            - name: config-secret
              mountPath: /config-src/secret
              readOnly: true
            # jellyfin side
            - name: jellyfin-var-lib
              mountPath: /var/lib/jellyfin
            - name: jellyfin-etc
              mountPath: /etc/jellyfin
            # Plugin preload staging (empty until phantom-library's plugin build/publish pipeline
            # stages a DLL here — Jellyfin runs fine with zero preload plugins).
            - name: plugin-preload
              mountPath: /opt/jellyfin/plugins-preload
      volumes:
        # FUSE mount point. Ephemeral (the virtual-MKV files are streamed on demand); each color's
        # container has its own mount namespace, so no per-color hostPath is needed anymore.
        - name: gostream-virtual
          emptyDir: {}
        - name: real-mkv
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            # Per-color single-writer gostream STATE (STATE/gostream.db inode map + config.db BoltDB).
            # Split from the old shared gostream-state PVC: exactly one gostream writer per embedded DB.
            claimName: gostream-state-{{ $color }}
        - name: warmup
          persistentVolumeClaim:
            claimName: gostream-warmup
        - name: config-merged
          emptyDir: {}
        - name: config-tuning
          configMap:
            name: gostream-config
        - name: config-secret
          secret:
            secretName: {{ $.Values.configSecretName }}
        - name: jellyfin-var-lib
          persistentVolumeClaim:
            claimName: jellyfin-var-lib-{{ $color }}
        - name: jellyfin-etc
          persistentVolumeClaim:
            claimName: jellyfin-etc-{{ $color }}
        - name: plugin-preload
          emptyDir: {}
{{- if ne $color (last $.Values.colorList) }}
---
{{- end }}
{{- end }}
