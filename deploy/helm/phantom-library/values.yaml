# ============================================================================================
# phantom-library Helm chart values — deploys ONE gostream+Jellyfin instance and/or its supporting
# singletons. Every piece is an INDEPENDENT toggle under `components`, so one chart covers both the
# simplest all-in-one deployment and any multi-release layout the consuming layer wants.
#
# SIMPLEST DEPLOYMENT (default): one release renders EVERYTHING — the workload, its per-instance
# PVCs, the gostream warmup cache PVC + tuning ConfigMap, and Prowlarr, with an Ingress at `hostname`.
# Set `hostname`, provide the two out-of-band secrets (imagePullSecret + configSecretName), done.
#
# SPLIT DEPLOYMENTS: turn any component off in one release and on in another. The workload mounts the
# warmup PVC (`warmup.pvcName`) and tuning ConfigMap (`gostreamConfig.configMapName`) BY NAME, so a
# release that renders the workload without those singletons simply expects some other release in the
# same namespace to have created them under those fixed names. This chart has NO knowledge of how the
# consuming layer wires multiple releases together — that is entirely the consumer's concern.
# ============================================================================================

# Namespace the release deploys into (informational only; the flux HelmRelease sets
# targetNamespace/createNamespace). Used for NOTES cross-references.
namespace: phantom-library

# Public hostname for this instance's Jellyfin. external-dns publishes it from the rendered Ingress
# (standard ingress resource discovery — the chart emits no DNSEndpoint). Additional hostnames served
# by this instance go in `ingress.extraHosts`.
hostname: phantom-library.example.com

# Resource-name suffix. Empty -> resources are `phantom-library`, `jellyfin-var-lib`, `gostream-state`,
# etc. Set to e.g. "a" -> `phantom-library-a`, `jellyfin-var-lib-a`, `gostream-state-a` so multiple
# workload releases coexist in one namespace without name collisions. The warmup PVC and tuning
# ConfigMap are NOT suffixed (fixed names) so split releases can share them.
nameSuffix: ""

# Which parts of the stack THIS release renders. Each is independent; defaults deploy a complete,
# self-contained stack. Turn individual pieces off to split ownership across multiple releases.
components:
  # Deployment + Service + Ingress (+ Certificate when tls.enabled and an issuer is named). The pod
  # mounts jellyfin/gostream PVCs, the warmup PVC, and the tuning ConfigMap BY NAME — enable the
  # matching storage/config components in this release, or expect another release to own them.
  workload: true
  # Per-instance Jellyfin PVCs: jellyfin-var-lib (library DB/metadata/plugins) + jellyfin-etc.
  jellyfinStorage: true
  # Per-instance gostream STATE PVC (gostream-state): STATE/gostream.db inode map + config.db BoltDB.
  gostreamState: true
  # gostream warmup cache PVC (`warmup.pvcName`, fixed/unsuffixed). Sized from warmup.quotaGb+headroomGi.
  warmupCache: true
  # gostream tuning ConfigMap (`gostreamConfig.configMapName`, fixed/unsuffixed).
  gostreamConfig: true
  # Standalone Prowlarr indexer aggregator (own Deployment/Service/PVC), reachable at svc `prowlarr`.
  prowlarr: true

# ---------------------------------------------------------------------------- ingress --
ingress:
  enabled: true
  # Traefik entrypoint. websecure = the 443 entrypoint fronted by the default TLSStore wildcard.
  entrypoint: websecure
  # Extra Jellyfin Hosts served by this instance IN ADDITION to `hostname`. A bare CNAME does not
  # rewrite the HTTP Host header, so a hostname that only CNAMEs here must ALSO be listed as a Host.
  extraHosts: []
  # Extra gostorm-UI Hosts (same rationale).
  extraGostormHosts: []

# TLS. Default OFF: ingresses carry no tls: block and traefik's default TLSStore serves the site
# wildcard by SNI. Set enabled=true to emit a tls: block; additionally set issuerRef.name to have
# the chart render a cert-manager Certificate that provisions the referenced secret per-host.
tls:
  enabled: false
  # cert-manager issuer for the Certificate (only used when enabled AND issuerRef.name is set).
  issuerRef:
    kind: ClusterIssuer   # ClusterIssuer | Issuer
    name: ""
  # TLS secret name. Empty -> "<fullname>-tls". Referenced by both the Ingress tls block and the
  # Certificate (when rendered).
  secretName: ""

# Container images — pinned BY REGISTRY-SERVED DIGEST (never a floating tag). Built in-cluster by
# Zuul/buildah, served from the gitea OCI registry. Pull secret below must exist in the namespace.
# To repin one instance independently, set `images` in that release's values only.
images:
  gostream:
    repository: git.spencerharmon.com/zuul/gostream
    digest: sha256:8fbd795c03f8f11d465e68e62fd39921fd810827993c83f6bdf5c478f3af6031
  jellyfin:
    repository: git.spencerharmon.com/zuul/jellyfin-phantom
    digest: sha256:f26071fd81dc34e11dee0f9fb681e9e9abd6265f296aa6ec37657ec81f5effe3
  pullPolicy: IfNotPresent

# Pull secret (kubernetes.io/dockerconfigjson) for the gitea OCI registry. Provisioned into the
# namespace OUT OF BAND (bridge script / copied from the gostream ns) — the chart only references it.
imagePullSecret: gitea-oci-pull

# gostream config secret (Opaque, single key config.secret.json). Provisioned OUT OF BAND. The chart
# mounts it read-only; gostream deep-merges it over the ConfigMap tuning JSON.
configSecretName: gostream-config-secret

# fsGroup so both apps' UIDs can write the local-path PVCs (jellyfin entrypoint mkdir -p's under them).
podSecurityContext:
  fsGroup: 1000

terminationGracePeriodSeconds: 60

# ------------------------------------------------------------------ gostream (per Pod) --
gostream:
  # gostorm web UI exposure. When true the Service adds a gostorm port and the Ingress serves
  # gostorm.<hostname> (+ ingress.extraGostormHosts). gostorm has its own auth layer.
  exposeUi: true
  # gostorm-UI hostname. Empty -> "gostorm." prepended to `hostname`.
  hostname: ""
  env:
    GOSTREAM_ROOT_PATH: /usr/local/state
    GOSTREAM_MOUNT_PATH: /var/gostream/gostream-mkv-virtual
    GOSTREAM_SOURCE_PATH: /mnt/gostream-mkv-real
    MKV_PROXY_CONFIG_PATH: /etc/gostream/config.json
    MKV_PROXY_CONFIG_TUNING_PATH: /config-src/tuning/config.tuning.json
    MKV_PROXY_CONFIG_SECRET_PATH: /config-src/secret/config.secret.json
    GOMEMLIMIT: 2200MiB
  ports:
    proxy: 8080
    metrics: 9080
    gostorm: 8090
  resources:
    requests: { cpu: "500m", memory: 1Gi }
    limits: { cpu: "2", memory: 3Gi }

# ------------------------------------------------------------------ jellyfin (per Pod) --
jellyfin:
  httpPort: 8096
  resources:
    requests: { cpu: "500m", memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }

# ---------------------------------------------------------------- prowlarr (standalone) --
# Indexer aggregator the plugin's source search calls (ProwlarrBaseUrl / ProwlarrApiKey). Runs as
# its OWN Deployment+Service (NOT a Jellyfin sidecar), reachable at the fixed DNS name `prowlarr`.
# We seed Prowlarr's config.xml with the SAME API key the migrated plugin config carries so the two
# authenticate out of the box. INDEXERS are host-local operator data (NOT part of the migration
# import) — add them in the Prowlarr UI after deploy
# (`kubectl -n phantom-library port-forward svc/prowlarr 9696:9696`).
prowlarr:
  image:
    repository: ghcr.io/linuxserver/prowlarr
    # Immutable multi-arch index digest (linuxserver "latest" at pin time). Bump deliberately.
    digest: sha256:2f3d31307beba3ba2dd226d191f5f5c14ee3b4d8b49277c64683f5ed97083179
  port: 9696
  # API key the plugin sends. MUST match the migrated Jellyfin.Plugin.PhantomLibrary.xml ProwlarrApiKey.
  # TODO(operator): move to a SOPS-managed Secret; kept inline to match the already-plaintext plugin config.
  apiKey: "4ba9056005b247f4b3ed78acb5f00fbf"
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"
  storage:
    size: 2Gi
  resources:
    requests: { cpu: "50m", memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# ------------------------------------------------------------------------ warmup cache --
# SINGLE SOURCE OF TRUTH for the warmup sizing. gostream enforces quotaGb as GiB (quota =
# quotaGb * 1024^3) and evicts toward it; the warmup PVC is sized quotaGb + headroomGi so the quota
# can never exceed the volume. Both the ConfigMap value and the warmup PVC storage derive from these.
# pvcName is the fixed (unsuffixed) name the workload mounts and components.warmupCache creates.
warmup:
  pvcName: gostream-warmup
  quotaGb: 45
  headroomGi: 5   # PVC capacity = quotaGb + headroomGi (Gi)

# --------------------------------------------------------------- gostream tuning config --
# configMapName is the fixed (unsuffixed) name the workload mounts and components.gostreamConfig
# creates. The data is rendered from `config` below (disk_warmup_quota_gb injected from warmup.quotaGb).
gostreamConfig:
  configMapName: gostream-config

# ---------------------------------------------------------------------------- storage --
persistence:
  storageClassName: local-path
  # Per-instance gostream STATE (STATE/gostream.db inode map + config.db BoltDB), single-writer.
  state:
    size: 5Gi
  # warmup size is DERIVED from warmup.quotaGb + warmup.headroomGi (see state-pvcs.yaml) — not set here.
  # Per-instance Jellyfin persistence.
  jellyfinVarLib:
    size: 100Gi   # real library metadata ≈ 84G; local-path does not enforce, sized honestly
  jellyfinEtc:
    size: 256Mi

# gostream non-secret tuning config (rendered verbatim to the ConfigMap's config.tuning.json). This
# is the structured form of gostream's reference config; disk_warmup_quota_gb is injected from
# warmup.quotaGb by the template, so DO NOT set it here.
config:
  master_concurrency_limit: 25
  read_ahead_budget_mb: 256
  metadata_cache_size_mb: 50
  write_buffer_size_kb: 64
  read_buffer_size_kb: 1024
  fuse_block_size_bytes: 1048576
  streaming_threshold_kb: 128
  log_level: "INFO"
  attr_timeout_seconds: 1
  entry_timeout_seconds: 1
  negative_timeout_seconds: 0
  http_client_timeout_seconds: 30
  max_retry_attempts: 6
  retry_delay_ms: 500
  rescue_grace_period_seconds: 240
  rescue_cooldown_hours: 24
  preload_workers_count: 4
  preload_initial_delay_ms: 1000
  warm_start_idle_seconds: 6
  max_concurrent_prefetch: 3
  cache_cleanup_interval_min: 5
  max_cache_entries: 10000
  gostorm_url: "http://127.0.0.1:8090"
  proxy_listen_port: 8080
  metrics_port: 9080
  blocklist_url: "https://github.com/Naunter/BT_BlockLists/raw/master/bt_blocklists.gz"
  physical_source_path: "/mnt/gostream-mkv-real"
  fuse_mount_path: "/var/gostream/gostream-mkv-virtual"
  warmup_head_size_mb: 64
  natpmp:
    enabled: false
    gateway: ""
    local_port: 8091
    vpn_interface: "wg0"
    lifetime: 60
    refresh: 45
  plex:
    url: "http://127.0.0.1:32400"
    library_id: 0
  library_add_timeout_sec: 45
  library_validation_lease_minutes: 10
