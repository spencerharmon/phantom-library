{{- if and .Values.components.workload .Values.ingress.enabled }}
{{/*
Single-instance Ingress.
  Jellyfin (:8096):  .Values.hostname ALWAYS, plus any .Values.ingress.extraHosts (a bare CNAME does
                     not rewrite the HTTP Host header, so a hostname that CNAMEs here must ALSO be a
                     Host). Exactly one instance may carry a given extra Host at a time.
  gostream dashboard (:9080, when gostream.exposeUi): the gostorm/tiramisu host (default tiramisu.<hostname>)
                     plus any .Values.ingress.extraGostormHosts. Fronts the metrics port's
                     /dashboard "GoStream Health Monitor" UI — the GoStorm engine port :8090 has no
                     browsable UI, so the dashboard host targets :9080, NOT :8090.
TLS: default OFF -> no tls: block, traefik's default TLSStore serves the site wildcard by SNI. When
.Values.tls.enabled the tls: block references the (optionally cert-manager-provisioned) secret.
external-dns publishes A-records from the Host rules (standard ingress discovery — no DNSEndpoint).
*/}}
{{- $jellyHosts := concat (list .Values.hostname) .Values.ingress.extraHosts }}
{{- $gostormHosts := list }}
{{- if .Values.gostream.exposeUi }}
{{- $gostormHosts = concat (list (include "phantom-library.gostormHost" .)) .Values.ingress.extraGostormHosts }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "phantom-library.fullname" . }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entrypoint }}
spec:
  ingressClassName: traefik
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        {{- range (concat $jellyHosts $gostormHosts) }}
        - {{ . }}
        {{- end }}
      secretName: {{ include "phantom-library.tlsSecret" . }}
  {{- end }}
  rules:
    {{- range $h := $jellyHosts }}
    - host: {{ $h }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "phantom-library.fullname" $ }}
                port:
                  number: {{ $.Values.jellyfin.httpPort }}
    {{- end }}
    {{- range $h := $gostormHosts }}
    - host: {{ $h }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "phantom-library.fullname" $ }}
                port:
                  number: {{ $.Values.gostream.ports.metrics }}
    {{- end }}
{{- end }}
