apiVersion: v2
name: phantom-library
description: >-
  Co-located gostream (FUSE torrent producer) + patched Jellyfin (FUSE consumer) deployment. Renders
  a gostream+Jellyfin instance (one Pod in a single mount namespace), its per-instance PVCs, a
  Service, and an Ingress with a templated hostname + optional cert-manager issuer, plus the
  supporting singletons (gostream warmup cache PVC, gostream tuning ConfigMap, Prowlarr). Every piece
  is an independent `components.*` toggle, so one chart covers both the simplest all-in-one deployment
  and any multi-release layout the consumer wires up. How releases are composed (e.g. a two-instance
  cutover) is entirely the consuming Flux/kustomize layer's concern. Consumed by flux as a HelmRelease.
type: application
# Chart version — MUST be bumped on every change (flux GitRepository/HelmRelease revs off it and,
# if ever OCI-published, Helm requires the pushed tag to equal this). 2.0.0: components split into
# independent per-piece toggles (workload / jellyfinStorage / gostreamState / warmupCache /
# gostreamConfig / prowlarr); removed the `shared` grouping, the `color`/`colorLabel` machinery, and
# all blue/green language (composition of releases is the consumer's concern). BREAKING values schema.
# 2.1.1: rename the gostorm control-panel host default label `gostorm.` -> `tiramisu.` (the rebranded
# GoStream/GoStorm dashboard name); host label only, no schema/value-key change.
# 2.6.1: Prowlarr's imagePullSecrets is now conditional on the new `prowlarr.imagePullSecret` value
# (empty by default), since the standalone Prowlarr stack pulls its PUBLIC upstream image directly
# and needs no pull secret; the workload Deployment's top-level `imagePullSecret` is unchanged.
# 2.7.1: generic, OFF-by-default `postgres.*` wiring (P4 Stage A step 1/2) — Jellyfin.Pgsql provider
# env vars + a forward-declared phantom.db logical-DB env surface, gated behind
# `postgres.enabled` so the chart stays color-agnostic (consumer picks which release enables it).
# 2.8.0: jellyfin-metadata-quota-reaper — `jellyfinMetadata.quotaGb`/`headroomGi` become the single
# source of truth for the shared metadata PVC's size (was a hand-set `persistence.jellyfinMetadata.
# size`, now derived, mirroring `warmup`); a new enforcing LRU reaper CronJob
# (`jellyfinMetadataReaper.*`) evicts regenerable artifacts (library/People/channels) back under
# quota and exposes usage-vs-quota metrics; new `jellyfin.metadataGeneration.*` values cut
# trickplay/person-image/artwork generation at the source. BREAKING values schema
# (`persistence.jellyfinMetadata.size` removed).
version: 2.9.0
# Tracks the app milestone, not a container tag (images are digest-pinned in values).
appVersion: "m14"
keywords:
  - jellyfin
  - gostream
  - phantom-library
home: https://github.com/spencerharmon/phantom-library
