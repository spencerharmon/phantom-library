{{/*
Storage split (each an independent component toggle):
  * gostreamState -> per-INSTANCE gostream STATE PVC (gostream-state[-<suffix>]). Holds
    <root>/STATE/gostream.db (inode map, SACRED) and <root>/config.db (gostorm BoltDB: torrents +
    TorrentsSavePath + settings). Both are SINGLE-WRITER embedded DBs (bbolt exclusive lock; SQLite
    single-writer), so each workload instance owns its own.
  * warmupCache -> the gostream warmup PVC (.Values.warmup.pvcName, fixed/unsuffixed). The
    infohash-addressed warmup cache at gostorm's TorrentsSavePath (/usr/local/warmup) is
    content-addressed, so instances that share a node converge on identical filenames and can share
    ONE RWO PVC. Rendered by whichever release enables components.warmupCache.
WARMUP-SIZING INVARIANT: capacity = warmup.quotaGb + warmup.headroomGi, so it can never be smaller
than the quota gostream enforces (quota = quotaGb * 1024^3). Both this size and the ConfigMap's
disk_warmup_quota_gb come from .Values.warmup — the single source Helm gives us.
*/}}
{{- if .Values.components.gostreamState }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gostream-state{{ include "phantom-library.suffix" . }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: state
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.state.size }}
{{- end }}
{{- if .Values.components.gostreamRealMkv }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gostream-real-mkv{{ include "phantom-library.suffix" . }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: real-mkv
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.realMkv.size }}
{{- end }}
{{- if and .Values.components.gostreamState .Values.components.warmupCache }}
---
{{- end }}
{{- if .Values.components.warmupCache }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.warmup.pvcName }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: warmup-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ printf "%dGi" (add (.Values.warmup.quotaGb | int) (.Values.warmup.headroomGi | int)) }}
{{- end }}
