{{- if .Values.components.jellyfinStorage }}
{{/*
Per-instance Jellyfin persistence (var-lib = library DB/metadata/plugins; etc = network.xml +
encoding config). Each workload instance owns its own so a bad rollout on one instance can never
touch the DB/config of another instance serving traffic.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-var-lib{{ include "phantom-library.suffix" . }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: jellyfin-var-lib
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.jellyfinVarLib.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-etc{{ include "phantom-library.suffix" . }}
  labels:
    {{- include "phantom-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: jellyfin-etc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.jellyfinEtc.size }}
{{- end }}
