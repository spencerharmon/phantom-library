# ============================================================================================
# phantom-library Helm chart values — deploys ONE gostream+Jellyfin instance and/or its supporting
# singletons. Every piece is an INDEPENDENT toggle under `components`, so one chart covers both the
# simplest all-in-one deployment and any multi-release layout the consuming layer wants.
#
# SIMPLEST DEPLOYMENT (default): one release renders EVERYTHING — the workload, its per-instance
# PVCs, the gostream warmup cache PVC + tuning ConfigMap, and Prowlarr, with an Ingress at `hostname`.
# Set `hostname`, provide the two out-of-band secrets (imagePullSecret + configSecretName), done.
#
# SPLIT DEPLOYMENTS: turn any component off in one release and on in another. The workload mounts the
# warmup PVC (`warmup.pvcName`) and tuning ConfigMap (`gostreamConfig.configMapName`) BY NAME, so a
# release that renders the workload without those singletons simply expects some other release in the
# same namespace to have created them under those fixed names. This chart has NO knowledge of how the
# consuming layer wires multiple releases together — that is entirely the consumer's concern.
# ============================================================================================

# Namespace the release deploys into (informational only; the flux HelmRelease sets
# targetNamespace/createNamespace). Used for NOTES cross-references.
namespace: phantom-library

# Public hostname for this instance's Jellyfin. external-dns publishes it from the rendered Ingress
# (standard ingress resource discovery — the chart emits no DNSEndpoint). Additional hostnames served
# by this instance go in `ingress.extraHosts`.
hostname: phantom-library.example.com

# Resource-name suffix. Empty -> resources are `phantom-library`, `jellyfin-var-lib`, `gostream-state`,
# etc. Set to e.g. "a" -> `phantom-library-a`, `jellyfin-var-lib-a`, `gostream-state-a` so multiple
# workload releases coexist in one namespace without name collisions. The warmup PVC and tuning
# ConfigMap are NOT suffixed (fixed names) so split releases can share them.
nameSuffix: ""

# Which parts of the stack THIS release renders. Each is independent; defaults deploy a complete,
# self-contained stack. Turn individual pieces off to split ownership across multiple releases.
components:
  # Deployment + Service + Ingress (+ Certificate when tls.enabled and an issuer is named). The pod
  # mounts jellyfin/gostream PVCs, the warmup PVC, and the tuning ConfigMap BY NAME — enable the
  # matching storage/config components in this release, or expect another release to own them.
  workload: true
  # Per-instance Jellyfin PVCs: jellyfin-var-lib (library DB/metadata/plugins) + jellyfin-etc.
  jellyfinStorage: true
  # Per-instance gostream STATE PVC (gostream-state): STATE/gostream.db inode map + config.db BoltDB.
  gostreamState: true
  # SHARED gostream physical-source PVC (`realMkv.pvcName`, fixed/unsuffixed): the infohash-named
  # (content-addressed) JSON stub descriptors gostream scans to build its virtual-MKV FS. Shared like
  # warmup so both colors see the same materialised catalogue (seamless flip). Owned by the release
  # that enables it; workload releases mount it by fixed name.
  gostreamRealMkv: true
  # gostream warmup cache PVC (`warmup.pvcName`, fixed/unsuffixed). Sized from warmup.quotaGb+headroomGi.
  warmupCache: true
  # gostream tuning ConfigMap (`gostreamConfig.configMapName`, fixed/unsuffixed).
  gostreamConfig: true
  # Standalone Prowlarr indexer aggregator (own Deployment/Service/PVC), reachable at svc `prowlarr`.
  prowlarr: true
  # SHARED Jellyfin metadata PVC (`jellyfinMetadata.pvcName`, fixed/unsuffixed): the derived,
  # color-independent artwork cache (posters/backdrops/people images) split out of jellyfin-var-lib
  # so a blue/green flip never copies it (identical across colors) and the idle color does not
  # duplicate ~78G on disk. Shared like warmup/real-mkv: owned by the release that enables it;
  # workload releases mount it via extraVolumes/extraVolumeMounts at /var/lib/jellyfin/metadata.
  jellyfinMetadata: false

# ---------------------------------------------------------------------------- ingress --
ingress:
  enabled: true
  # Traefik entrypoint. websecure = the 443 entrypoint fronted by the default TLSStore wildcard.
  entrypoint: websecure
  # Extra Jellyfin Hosts served by this instance IN ADDITION to `hostname`. A bare CNAME does not
  # rewrite the HTTP Host header, so a hostname that only CNAMEs here must ALSO be listed as a Host.
  extraHosts: []
  # Extra gostorm-UI Hosts (same rationale).
  extraGostormHosts: []

# TLS. Default OFF: ingresses carry no tls: block and traefik's default TLSStore serves the site
# wildcard by SNI. Set enabled=true to emit a tls: block; additionally set issuerRef.name to have
# the chart render a cert-manager Certificate that provisions the referenced secret per-host.
tls:
  enabled: false
  # cert-manager issuer for the Certificate (only used when enabled AND issuerRef.name is set).
  issuerRef:
    kind: ClusterIssuer   # ClusterIssuer | Issuer
    name: ""
  # TLS secret name. Empty -> "<fullname>-tls". Referenced by both the Ingress tls block and the
  # Certificate (when rendered).
  secretName: ""

# Container images — pinned BY REGISTRY-SERVED DIGEST (never a floating tag). Built in-cluster by
# Zuul/buildah, served from the gitea OCI registry. Pull secret below must exist in the namespace.
# To repin one instance independently, set `images` in that release's values only.
images:
  gostream:
    repository: git.spencerharmon.com/zuul/gostream
    digest: sha256:8fbd795c03f8f11d465e68e62fd39921fd810827993c83f6bdf5c478f3af6031
  jellyfin:
    repository: git.spencerharmon.com/zuul/jellyfin-phantom
    digest: sha256:f26071fd81dc34e11dee0f9fb681e9e9abd6265f296aa6ec37657ec81f5effe3
  pullPolicy: IfNotPresent

# Pull secret (kubernetes.io/dockerconfigjson) for the gitea OCI registry. Provisioned into the
# namespace OUT OF BAND (bridge script / copied from the gostream ns) — the chart only references it.
imagePullSecret: gitea-oci-pull

# gostream config secret (Opaque, single key config.secret.json). Provisioned OUT OF BAND. The chart
# mounts it read-only; gostream deep-merges it over the ConfigMap tuning JSON.
configSecretName: gostream-config-secret

# fsGroup so both apps' UIDs can write the local-path PVCs (jellyfin entrypoint mkdir -p's under them).
podSecurityContext:
  fsGroup: 1000
  # OnRootMismatch avoids kubelet's recursive volume chown on every pod (re)start: it walks the
  # whole tree only when the volume ROOT doesn't already match fsGroup. The large metadata PVC
  # (~2.7M files) otherwise re-chowns for many minutes on every restart, stalling container start
  # and extending blue/green cutover outages. Set "" to omit the field (falls back to Always).
  fsGroupChangePolicy: OnRootMismatch

terminationGracePeriodSeconds: 60

# ------------------------------------------------------------------ gostream (per Pod) --
gostream:
  # gostream Health Monitor dashboard exposure. When true the Service adds a `dashboard` port and the
  # Ingress serves tiramisu.<hostname> (+ ingress.extraGostormHosts), fronting the metrics port's
  # /dashboard UI. NOTE: the GoStorm engine port (:8090) is API-only with no browsable UI, so the
  # dashboard host targets :9080 (metrics), NOT :8090.
  exposeUi: true
  # gostorm/tiramisu-UI hostname. Empty -> "tiramisu." prepended to `hostname`.
  hostname: ""
  # Landing splash fronting the tiramisu host: nginx serves a link page at exactly "/" (gostream :9080
  # has no root handler) and reverse-proxies every other path to the gostream dashboard port, so
  # /dashboard and /control keep working on the same host. Rendered with the workload when exposeUi.
  splash:
    image: nginx:1.27-alpine
  env:
    GOSTREAM_ROOT_PATH: /usr/local/state
    GOSTREAM_MOUNT_PATH: /var/gostream/gostream-mkv-virtual
    GOSTREAM_SOURCE_PATH: /mnt/gostream-mkv-real
    MKV_PROXY_CONFIG_PATH: /etc/gostream/config.json
    MKV_PROXY_CONFIG_TUNING_PATH: /config-src/tuning/config.tuning.json
    MKV_PROXY_CONFIG_SECRET_PATH: /config-src/secret/config.secret.json
    GOMEMLIMIT: 2200MiB
  ports:
    proxy: 8080
    metrics: 9080
    gostorm: 8090
  resources:
    requests: { cpu: "500m", memory: 1Gi }
    limits: { cpu: "2", memory: 3Gi }

# ------------------------------------------------------------------ jellyfin (per Pod) --
jellyfin:
  httpPort: 8096
  # Number of concurrent Jellyfin+gostream replicas on THIS color (StatefulSet .spec.replicas).
  # 1 (default) = the classic single-instance-per-color blue/green topology: the workload binds the
  # STATIC per-instance RWO PVCs (jellyfin-var-lib[-<suffix>], jellyfin-etc[-<suffix>],
  # gostream-state[-<suffix>]) by fixed claim name — unchanged from the previous Deployment.
  # >1 = P4 Stage B multi-replica: each replica gets its OWN per-instance RWO state via the
  # StatefulSet's volumeClaimTemplates (claim <template>-<statefulset>-<ordinal>), so two replicas
  # never double-bind one single-writer claim. The SHARED content-addressed sources (real-mkv,
  # warmup) stay one RWO claim mounted by every replica. Authoritative library/user data is shared
  # via PostgreSQL (Stage A), never shared sqlite.
  replicas: 1
  resources:
    requests: { cpu: "500m", memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
  # Cut jellyfin-metadata generation AT THE SOURCE (cheaper than reaping it after the fact). These
  # become env vars the entrypoint/wrapper applies to Jellyfin's encoding/library options at
  # startup (PHANTOM_JELLYFIN_* — read by the patched entrypoint, never a baked config file so a
  # value change here needs no image rebuild). All three directly bound the three subtrees the
  # reaper below also targets (channels/ trickplay tiles, People/ artwork, library/ artwork).
  metadataGeneration:
    # Trickplay (hover-scrub filmstrip) generation. Trickplay tiles are the bulk of `channels/`.
    trickplayEnabled: true
    trickplayIntervalSeconds: 15        # sparser sampling -> fewer tiles per item
    trickplayQualityPercent: 60         # lower JPEG quality -> smaller tiles
    # Person (actor/director) artwork download cap. Bounds `People/` growth (~18G on the incident PVC).
    personImageMaxDownloadsPerRefresh: 500
    # Library artwork (poster/backdrop/logo) resolution cap in pixels on the long edge. Bounds
    # `library/` per-item directory size (~250-275MB/item on the incident PVC).
    artworkMaxResolutionPx: 1500

# ---------------------------------------------------------------- shared PostgreSQL (P4 Stage A) --
# Generic, OFF-by-default wiring for pointing this instance's Jellyfin (via the external
# `Jellyfin.Pgsql` EF Core provider) and the plugin's own `phantom.db` logical DB at a SHARED
# PostgreSQL server, instead of the default per-color SQLite files. This chart stays color-agnostic
# per the bluegreen-topology-obfuscation skill: it has NO idea which instance is "active" or "idle" —
# it only offers the toggle. The CONSUMING layer (the controller/HelmRelease composition) decides
# which release(s) set `postgres.enabled: true` (e.g. only the inactive color's release, while the
# migration in `scripts/phantom-migrate-jellyfindb-to-postgres.sh` runs and is hand-validated) and
# supplies the connection details + the out-of-band Secret named by `*.passwordSecretName`.
#
# `jellyfin.*` follows the `Jellyfin.Pgsql` (JPVenson) image's own documented env-var contract
# (POSTGRES_HOST/PORT/DB/USER/PASSWORD/SSLMODE/TRUSTSERVERCERTIFICATE/COMMAND_TIMEOUT) so the SAME
# values drive that provider once the image bakes it in — no chart-invented naming for that half.
# `phantom.*` is the plugin's OWN logical DB (a separate Postgres database on the same server): the
# env var names here (PHANTOM_POSTGRES_*) are a forward-declared surface for `p4-phantomdb-postgres-
# backend` (the plugin does not read Postgres config yet) so the wiring lands once, ahead of the
# plugin-side implementation, per the task's Stage A step 1/2 split.
postgres:
  enabled: false
  jellyfin:
    host: ""
    port: 5432
    db: jellyfin_prod
    user: jellyfin
    # Secret (Opaque) holding the connection password, provisioned OUT OF BAND like
    # `configSecretName` above. Referenced by name + key only; the chart never sees the value.
    passwordSecretName: ""
    passwordSecretKey: postgres-password
    sslMode: ""              # e.g. "Require"; empty omits POSTGRES_SSLMODE
    trustServerCertificate: false
    commandTimeoutSeconds: 30
  phantom:
    host: ""
    port: 5432
    db: phantom_prod
    user: jellyfin
    passwordSecretName: ""
    passwordSecretKey: postgres-password

# ---------------------------------------------------------------- prowlarr (standalone) --
# Indexer aggregator the plugin's source search calls (ProwlarrBaseUrl / ProwlarrApiKey). Runs as
# its OWN Deployment+Service (NOT a Jellyfin sidecar), reachable at the fixed DNS name `prowlarr`.
# We seed Prowlarr's config.xml with the SAME API key the migrated plugin config carries so the two
# authenticate out of the box, and with Forms auth Required so the UI is login-gated (Prowlarr forces
# admin-user creation on first visit). INDEXERS are host-local operator data (NOT part of the
# migration import) — add them in the Prowlarr UI after deploy
# (`kubectl -n phantom-library port-forward svc/prowlarr 9696:9696`, or via prowlarr.ingress).
prowlarr:
  image:
    repository: ghcr.io/linuxserver/prowlarr
    # Immutable multi-arch index digest (linuxserver "latest" at pin time). Bump deliberately.
    digest: sha256:2f3d31307beba3ba2dd226d191f5f5c14ee3b4d8b49277c64683f5ed97083179
  # Pull secret for the Prowlarr image, empty by default. Prowlarr pulls the PUBLIC
  # ghcr.io/linuxserver/prowlarr image directly from upstream (never mirrored through the gitea OCI
  # registry), so it needs NO pull secret — unlike the gostream/jellyfin-phantom workload pod, which
  # pulls patched images from the private gitea registry via the top-level `imagePullSecret`. Leave
  # empty to render the Prowlarr Deployment with no imagePullSecrets block; set it only if this
  # release's Prowlarr image is ever repointed at a private registry.
  imagePullSecret: ""
  port: 9696
  # API key the plugin sends. MUST match the migrated Jellyfin.Plugin.PhantomLibrary.xml ProwlarrApiKey.
  # TODO(operator): move to a SOPS-managed Secret; kept inline to match the already-plaintext plugin config.
  apiKey: "4ba9056005b247f4b3ed78acb5f00fbf"
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"
  storage:
    size: 2Gi
  # Optional Ingress fronting the Prowlarr UI/API. Default OFF — the generic chart ships Prowlarr
  # reachable only in-cluster / via port-forward. A consuming layer that wants browser access sets
  # enabled=true and one or more hosts (Prowlarr's own Forms auth, seeded above, gates the UI; the
  # plugin still authenticates with the API key). external-dns publishes A-records from the Host rules.
  ingress:
    enabled: false
    hosts: []
  resources:
    requests: { cpu: "50m", memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# ---------------------------------------------------- plugin -> Prowlarr wiring (p6-prowlarr-indexer-wiring) --
# Projects the plugin's PluginConfiguration.ProwlarrBaseUrl/ProwlarrApiKey into the deployed
# Jellyfin.Plugin.PhantomLibrary.xml on the jellyfin-var-lib PVC, so the plugin's MagnetSelector
# treats the in-cluster Prowlarr (rendered above) as a capable indexer for no-IMDB titles. Runs as
# an idempotent init container (patches the existing XML in place; a fresh/never-configured install
# still boots and writes the file itself, so the patch step tolerates the file being absent on
# first boot and simply skips). The API key is sourced from a k8s Secret — NEVER inline in
# values/git — materialised out of band by the flux cross-dep `phantom-library-prowlarr-apikey-
# secret` (data key `ProwlarrApiKey`). Leave `apiKeySecretName` empty to skip wiring entirely (the
# plugin then behaves exactly as before: Torrentio-only, ProwlarrBaseUrl/ProwlarrApiKey stay empty).
prowlarrConfig:
  # In-cluster Prowlarr Service URL the plugin should call (matches prowlarr.port above).
  baseUrl: "http://prowlarr:9696"
  # Out-of-band Secret (Opaque) holding the Prowlarr API key, keyed `ProwlarrApiKey`. Provisioned by
  # flux:phantom-library-prowlarr-apikey-secret (scripts/provision-prowlarr-apikey-secret.sh in the
  # flux repo). Empty disables the init container (no Prowlarr wiring rendered).
  apiKeySecretName: "prowlarr-apikey"
  apiKeySecretKey: "ProwlarrApiKey"

# ------------------------------------------------------------------------ warmup cache --
# SINGLE SOURCE OF TRUTH for the warmup sizing. gostream enforces quotaGb as GiB (quota =
# quotaGb * 1024^3) and evicts toward it; the warmup PVC is sized quotaGb + headroomGi so the quota
# can never exceed the volume. Both the ConfigMap value and the warmup PVC storage derive from these.
# pvcName is the fixed (unsuffixed) name the workload mounts and components.warmupCache creates.
warmup:
  pvcName: gostream-warmup
  quotaGb: 45
  headroomGi: 5   # PVC capacity = quotaGb + headroomGi (Gi)

# ---------------------------------------------------------- gostream physical source --
# The /mnt/gostream-mkv-real stub pool. Stubs are infohash-named (content-addressed), so both colors
# converge on identical files -> ONE shared RWO PVC (like warmup). pvcName is the fixed (unsuffixed)
# name the workload mounts and components.gostreamRealMkv creates. Size lives under persistence.realMkv.
realMkv:
  pvcName: gostream-real-mkv

# ---------------------------------------------------------- shared Jellyfin metadata --
# The /var/lib/jellyfin/metadata artwork cache, split into ONE shared RWO PVC both colors mount (by
# fixed name) at /var/lib/jellyfin/metadata via extraVolumes/extraVolumeMounts. Derived + color-
# independent, so it is never part of a flip's DB sync. Created by components.jellyfinMetadata.
#
# SINGLE SOURCE OF TRUTH for metadata cache sizing, mirroring `warmup` above: quotaGb is what the
# reaper CronJob (jellyfin-metadata-reaper-cronjob.yaml) enforces by LRU-evicting regenerable
# artifacts once usage exceeds it; the PVC (jellyfin-pvcs.yaml) is sized quotaGb + headroomGi so the
# quota can never exceed the volume. `persistence.jellyfinMetadata.size` below is DERIVED from these
# two values in the template — do not hand-set a byte size in two places.
jellyfinMetadata:
  pvcName: jellyfin-metadata
  quotaGb: 60
  headroomGi: 10   # PVC capacity = quotaGb + headroomGi (Gi)

# Enforcing LRU reaper CronJob for the jellyfin-metadata cache. Owned by the release that enables
# components.jellyfinMetadata (the singleton owner), same as the PVC itself. The script is baked
# into the workload's own image at /usr/local/bin/jellyfin-metadata-reaper.sh (see
# scripts/jellyfin-metadata-reaper.sh) — the CronJob just supplies args/env, no separate image.
jellyfinMetadataReaper:
  enabled: true
  schedule: "17 * * * *"   # hourly, off-the-hour to avoid thundering-herd with other cron
  # Subtrees the reaper is allowed to touch — every entry MUST be a derived/regenerable artifact
  # directory under the PVC mount; a scan/refresh can always rebuild anything reaped here.
  paths:
    - library
    - People
    - channels
  # DB-backed IMPORTANCE ranking. atime alone is a weak signal on this volume (it is mounted
  # `relatime`, so an atime only refreshes when the old one is >24h stale) — which means a pure-LRU
  # reaper can evict a poster you view constantly before one you have never opened. When enabled the
  # reaper runs ONE read-only aggregate over Jellyfin's `UserData` table and evicts in tier order:
  #   tier 0 never played by anyone   -> evicted FIRST (the overwhelming bulk of the cache)
  #   tier 1 played, but not within recentDays
  #   tier 2 played within recentDays
  #   tier 3 favourited or in-progress -> evicted LAST
  # atime only breaks ties WITHIN a tier. If the DB is unreachable the run degrades to atime-only
  # LRU and still protects the disk (never a hard dependency); the
  # jellyfin_metadata_reaper_importance_ranking_active metric exposes which mode ran.
  # Point these at the SAME Jellyfin DB the workload uses (see `postgres.jellyfin`).
  importance:
    enabled: false
    # Image used ONLY by the init container that runs the importance query. The workload
    # (jellyfin-phantom) image ships no psql, so the query cannot run in the reaper container
    # itself; this must be an image that provides psql. Pinned to the same major as the server.
    clientImage: docker.io/library/postgres:16.14-alpine
    host: ""
    port: 5432
    database: ""
    user: ""
    passwordSecretName: ""
    passwordSecretKey: postgres-password
    recentDays: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests: { cpu: "50m", memory: 96Mi }
    # 256Mi OOMKilled (exit 137) while ranking ~126k files: GNU sort sizes its buffer from HOST
    # RAM, not the cgroup limit. The script now caps it (-S) and spills to the volume (-T), but
    # keep a little headroom for the candidate list itself.
    limits: { cpu: "500m", memory: 384Mi }

# --------------------------------------------------------------- gostream tuning config --
# configMapName is the fixed (unsuffixed) name the workload mounts and components.gostreamConfig
# creates. The data is rendered from `config` below (disk_warmup_quota_gb injected from warmup.quotaGb).
gostreamConfig:
  configMapName: gostream-config

# ------------------------------------------------------------- extra pod volumes/mounts --
# Escape hatch for attaching additional volumes to the single Deployment WITHOUT touching the happy
# path (both default empty). Used by the blue/green topology to mount the SHARED jellyfin-metadata
# PVC at /var/lib/jellyfin/metadata (see components.jellyfinMetadata). Standard pod volume /
# volumeMount list syntax; appended verbatim after the built-in volumes/mounts.
extraVolumes: []
extraVolumeMounts: []

# ---------------------------------------------------------------------------- storage --
persistence:
  storageClassName: local-path
  # Per-instance gostream STATE (STATE/gostream.db inode map + config.db BoltDB), single-writer.
  state:
    size: 5Gi
  # gostream physical source (JSON stubs only — real media is streamed, never stored here); tiny.
  realMkv:
    size: 1Gi
  # warmup size is DERIVED from warmup.quotaGb + warmup.headroomGi (see state-pvcs.yaml) — not set here.
  # Per-instance Jellyfin persistence.
  jellyfinVarLib:
    size: 100Gi   # real library metadata ≈ 84G; local-path does not enforce, sized honestly
  jellyfinEtc:
    size: 256Mi
  # jellyfinMetadata size is DERIVED from jellyfinMetadata.quotaGb + jellyfinMetadata.headroomGi
  # (see jellyfin-pvcs.yaml) — not set here. The reaper CronJob enforces the quota; local-path only
  # honors the resulting capacity as an upper bound.

# gostream non-secret tuning config (rendered verbatim to the ConfigMap's config.tuning.json). This
# is the structured form of gostream's reference config; disk_warmup_quota_gb is injected from
# warmup.quotaGb by the template, so DO NOT set it here.
config:
  master_concurrency_limit: 25
  read_ahead_budget_mb: 256
  metadata_cache_size_mb: 50
  write_buffer_size_kb: 64
  read_buffer_size_kb: 1024
  fuse_block_size_bytes: 1048576
  streaming_threshold_kb: 128
  log_level: "INFO"
  attr_timeout_seconds: 1
  entry_timeout_seconds: 1
  negative_timeout_seconds: 0
  http_client_timeout_seconds: 30
  max_retry_attempts: 6
  retry_delay_ms: 500
  rescue_grace_period_seconds: 240
  rescue_cooldown_hours: 24
  preload_workers_count: 4
  preload_initial_delay_ms: 1000
  warm_start_idle_seconds: 6
  max_concurrent_prefetch: 3
  cache_cleanup_interval_min: 5
  max_cache_entries: 10000
  gostorm_url: "http://127.0.0.1:8090"
  proxy_listen_port: 8080
  metrics_port: 9080
  blocklist_url: "https://github.com/Naunter/BT_BlockLists/raw/master/bt_blocklists.gz"
  physical_source_path: "/mnt/gostream-mkv-real"
  fuse_mount_path: "/var/gostream/gostream-mkv-virtual"
  warmup_head_size_mb: 64
  natpmp:
    enabled: false
    gateway: ""
    local_port: 8091
    vpn_interface: "wg0"
    lifetime: 60
    refresh: 45
  plex:
    url: "http://127.0.0.1:32400"
    library_id: 0
  library_add_timeout_sec: 45
  library_validation_lease_minutes: 10
  # Prowlarr indexer for gostream's OWN source resolution. Non-secret half only: enabled +
  # in-cluster URL. The api_key is supplied by the out-of-band gostream-config-secret
  # (config.secret.json prowlarr.api_key), deep-merged OVER this at container start
  # (jq '.[0] * .[1]'), so it never lands in the ConfigMap / git. tmdb_api_key is likewise
  # secret-only. When enabled, gostream uses Prowlarr instead of torrentio_url.
  prowlarr:
    enabled: true
    url: "http://prowlarr:9696/"
