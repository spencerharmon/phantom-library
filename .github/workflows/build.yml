name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/Jellyfin.Plugin.PhantomLibrary/Jellyfin.Plugin.PhantomLibrary.csproj

      - name: Build (Release)
        run: dotnet build src/Jellyfin.Plugin.PhantomLibrary/Jellyfin.Plugin.PhantomLibrary.csproj -c Release --no-restore

      - name: Test
        run: |
          if [ -d tests ] && find tests -name '*.csproj' -print -quit | grep -q .; then
            dotnet test --configuration Release --no-build || true
          else
            echo "no test projects yet"
          fi

      - name: Upload assembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.PhantomLibrary
          path: src/Jellyfin.Plugin.PhantomLibrary/bin/Release/net9.0/Jellyfin.Plugin.PhantomLibrary.dll
          if-no-files-found: error
