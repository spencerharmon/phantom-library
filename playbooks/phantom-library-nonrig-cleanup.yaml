---
# Post-run cleanup for the non-rig gate. Zuul runs post-run playbooks even when
# the main run failed, so this is the guaranteed hook that leaves no dotnet
# build server / testhost process behind on the (potentially reused) executor
# node. The run playbook's in-script trap already does this on the happy and
# trap paths; this is the belt-and-suspenders guarantee.
#
# best-effort: cleanup must never turn a green run red, nor mask a real
# failure, so its own failure is ignored here — the authoritative "no leftover
# process" gate is the trap inside tools/ci/nonrig-build-test.sh.

- name: Non-rig gate cleanup
  hosts: all
  tasks:
    - name: Shut down dotnet build servers and verify no stray processes
      ansible.builtin.shell:
        cmd: exec ./tools/ci/nonrig-cleanup.sh
        chdir: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}"
        executable: /bin/bash
      ignore_errors: true
